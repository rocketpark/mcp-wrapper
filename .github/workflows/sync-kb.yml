name: Sync Offices to Botpress KB

on:
  # Weekly on Sunday at 2am UTC
  schedule:
    - cron: '0 2 * * 0'

  # Manual trigger from GitHub UI or CLI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no upload)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run sync script
        env:
          BOTPRESS_PAT: ${{ secrets.BOTPRESS_PAT }}
          BOTPRESS_BOT_ID: ${{ secrets.BOTPRESS_BOT_ID }}
          BOTPRESS_KB_ID: ${{ secrets.BOTPRESS_KB_ID }}
          MCP_ENDPOINT: ${{ secrets.MCP_ENDPOINT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/sync-offices-to-botpress.js

      - name: Report status
        if: success()
        run: echo "Sync completed successfully"

      - name: Report failure
        if: failure()
        run: echo "Sync failed - check logs above"
