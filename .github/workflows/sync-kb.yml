name: Sync Offices to Botpress KB

on:
  # Weekly on Sunday at 2am UTC
  schedule:
    - cron: '0 2 * * 0'

  # Manual trigger from GitHub UI or CLI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no upload)'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        env:
          BOTPRESS_PAT: ${{ secrets.BOTPRESS_PAT }}
          BOTPRESS_BOT_ID: ${{ secrets.BOTPRESS_BOT_ID }}
          BOTPRESS_KB_ID: ${{ secrets.BOTPRESS_KB_ID }}
          MCP_ENDPOINT: ${{ secrets.MCP_ENDPOINT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/sync-offices-to-botpress.js

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Sync completed successfully"
          else
            echo "❌ Sync failed - check logs above"
          fi
