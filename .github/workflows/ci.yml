name: CI

on:
  push:
    branches: [craft-5, main]
  pull_request:
    branches: [craft-5, main]

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, dom
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit tests/Unit --colors=always --no-coverage

      - name: Run integration tests
        run: |
          php tests/test-graphql-sanitization.php
          php tests/test-ip-validator.php
          php tests/test-ip-validator-ipv6.php
          php tests/test-request-timeout-exception.php

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer security audit (informational)
        run: composer audit --no-dev --abandoned=ignore
        continue-on-error: true

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: botpress-integration

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: botpress-integration/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Botpress types (bp build)
        run: npm run build

      - name: Type check
        run: npm run check:type
